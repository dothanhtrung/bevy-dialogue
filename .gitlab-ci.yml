image: "dothanhtrung/bevy-dev:latest"

before_script:
  - sed -i '/^target-dir =/d' .cargo/config.toml

cache: &global_cache
  key: cargo_cache
  paths:
    - target/
    - .cargo/registry/index
    - .cargo/registry/cache
    - .cargo/bin
  policy: pull-push

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

test:
  stage: test
  script:
    - cargo test --tests
    - cargo test --examples
    - find . -mtime +30 -delete || true
  rules:
    - changes:
      - Cargo.toml
      - src/**/*
      - examples/**/*
      - tests/**/*

